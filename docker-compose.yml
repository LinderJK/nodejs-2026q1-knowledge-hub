services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - knowledge-hub-network
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:4000/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - knowledge-hub-network
  adminer:
      image: adminer
      profiles: [ "debug"]
      ports:
        - 8080:8080
      networks:
        - knowledge-hub-network
      restart: unless-stopped
  

networks:
  knowledge-hub-network:
    driver: bridge

volumes:
  db-data:
    driver: local
